services:
  http:
    image: docker.io/library/traefik:v3.6
    command:
      - "--providers.docker"
      - "--providers.docker.exposedByDefault=false"
      - "--providers.docker.network=${DOCKER_NETWORK_NAME}"
      - "--providers.docker.constraints=Label(`eu.wiss-ki.barrel.distillery`,`${DOCKER_NETWORK_NAME}`)"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.middlewares=strip-headers@docker"
      - "--entrypoints.web.proxyProtocol.insecure=true"

      ## for debugging purposes, the following can be enabled.
      # - "--api.insecure=true"
    #ports:
    #  # - "80:80"
    #  # - "127.0.0.1:8888:8080"
    labels:
      - "eu.wiss-ki.barrel.distillery=${DOCKER_NETWORK_NAME}"
      - "traefik.enable=true"
      - "traefik.http.middlewares.strip-headers.headers.customresponseheaders.Server="
      - "traefik.http.middlewares.strip-headers.headers.customresponseheaders.X-Powered-By="
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
    restart: always
    networks:
      - default

networks:
  default:
    name: ${DOCKER_NETWORK_NAME}
    external: true
